units:
  px: cx + 2
  py: cy + 2
  screwSize: 1.5 # defaults to M2 screw
  standoffSize: 2.5

points:
  key:
    padding: cy
    spread: cx
  zones:
    main:
      rows:
        bottom:
        home:
        top:

      columns:
        pinkie:
          rows:
            bottom.from_net: P15
            home.from_net: P16
            top.from_net: P5
        ring:
          rows:
            bottom.from_net: P14
            home.from_net: P8
            top.from_net: P4
          key:
            stagger: 12
        middle:
          rows:
            bottom.from_net: P10
            home.from_net: P7
            top.from_net: P3
          key:
            stagger: 7
        index:
          rows:
            bottom.from_net: P18
            home.from_net: P6
            top.from_net: P2
          key:
            stagger: -5
        far:
          rows:
            bottom.from_net: P21
            home.from_net: P0
            top.from_net: P1
          key:
            stagger: -3

    thumb:
      anchor:
        ref: main_far_bottom
        shift: [-10, -20]
        rotate: -20
      rows:
        home:
      columns:
        inner:
          rows:
            home.from_net: P19
        outer:
          rows:
            home.from_net: P20
          key:
            column_net: P7
            rotate: -10
            spread: cx+2
            stagger: -2

outlines:
  _rawKeyOutline:
    - what: rectangle
      where: true # Matches all keys
      size: [cx+2, cy+2]

  _fill:
    - what: polygon
      operation: stack
      points:
        - ref: main_far_home
          shift: [0.5px,0.5py]
        - ref: main_far_home
          shift: [0.5px,0.5py]
        - ref: main_far_bottom
          shift: [0.5px,-0.5py]
        - ref: thumb_outer_home
          shift: [0.5px,0.5py]
        - ref: thumb_outer_home
          shift: [0.5px,-0.5py]
        - ref: thumb_inner_home
          shift: [-0.5px,-0.5py]
        - ref: main_ring_bottom
          shift: [0.5px,-0.5py]
        - ref: main_pinkie_bottom
          shift: [-0.5px,0.5py]

  _mounting:
    - what: circle
      radius: screwSize
      where:
        ref: [main_ring_top]
        shift: [-0.3cx, -0.3cy]
    - what: circle
      radius: screwSize
      where:
        ref: [main_index_top]
        shift: [0.3cx, -0.25cy]
    - what: circle
      radius: screwSize
      where:
        ref: [main_ring_bottom]
        shift: [-0.3cx, -0.3cy]
    - what: circle
      radius: screwSize
      where:
        ref: [main_index_bottom]
        shift: [0.3cx, -0.3cy]
    - what: circle
      radius: screwSize
      where:
        ref: [thumb_inner_home]
        shift: [0.5cx, -0.2cy]

  _standoff:
    - what: circle
      radius: standoffSize
      where:
        ref: [main_ring_top]
        shift: [-0.3cx, -0.3cy]
    - what: circle
      radius: standoffSize
      where:
        ref: [main_index_top]
        shift: [0.3cx, -0.25cy]
    - what: circle
      radius: standoffSize
      where:
        ref: [main_ring_bottom]
        shift: [-0.3cx, -0.3cy]
    - what: circle
      radius: standoffSize
      where:
        ref: [main_index_bottom]
        shift: [0.3cx, -0.3cy]
    - what: circle
      radius: standoffSize
      where:
        ref: [thumb_inner_home]
        shift: [0.5cx, -0.2cy]

  _powerBtn:
    - what: rectangle
      size: [5, 8]
      where:
        ref: main_far_bottom
        shift: [11, -15]
        rotate: -54

  _usbc:
    - what: rectangle
      size: [5, 8]
      where:
        ref: main_far_top
        shift: [10, -13]

  board:
    - name: _fill
    - operation: add
      name: _rawKeyOutline
      # fillet: 1.4

  boardWithMounting:
    - name: board
    - operation: stack
      name: _standoff
    - operation: stack
      name: _mounting
    - operation: stack
      name: _powerBtn
    - operation: stack
      name: _usbc


pcbs:
  ergodeer_v3:
    outlines:
      main:
        outline: board
    footprints:
      controller:
        what: nice_nano_2
        where:
          ref: main_far_top
          shift: [-7.5, -13]
          rotate: -90
        params:
          reversible: false

      choc_hotswap:
        what: choc
        where: true
        params:
          keycaps: true
          reverse: true
          hotswap: true
          from: "{{from_net}}"
          to: "GND"

      gnd_vias:
        what: via
        where: true
        params:
          net: GND
        adjust:
          shift: [2, 2]
    
      net_vias:
        what: via
        where: true
        params:
          net: "{{from_net}}"
        adjust:
          shift: [-1, 3.5]
    
      battery_connector:
        what: bat_jst
        where:
          ref: main_far_bottom
          shift: [4, -12]
          rotate: -90
        params:
          BAT_P: BAT_P
          BAT_N: GND
          reversible: true
      
      slider:
        what: slider
        where:
          ref: main_far_bottom
          shift: [11, -15]
          rotate: -54
        params:
          from: BAT_P
          to: RAW

      slider_btm:
        what: slider
        where:
          ref: main_far_bottom
          shift: [11, -15]
          rotate: -54
        params:
          side: B
          from: BAT_P
          to: RAW

      holeTopLeft:
        what: mountinghole
        where:
          ref: [main_ring_top]
          shift: [-0.3cx, -0.3cy]

      holeTopRight:
        what: mountinghole
        where:
          ref: [main_index_top]
          shift: [0.3cx, -0.25cy]

      holeBottomLeft:
        what: mountinghole
        where:
          ref: [main_ring_bottom]
          shift: [-0.3cx, -0.3cy]

      holeBottomRight:
        what: mountinghole
        where:
          ref: [main_index_bottom]
          shift: [0.3cx, -0.3cy]

      holeThumb:
        what: mountinghole
        where:
          ref: [thumb_inner_home]
          shift: [0.5cx, -0.2cy]

